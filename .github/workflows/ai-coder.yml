name: AI Coder
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  modify-code:
    if: startsWith(github.event.issue.title, 'ai:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Generative AI SDK
        run: pip install google-generativeai

      - name: Apply Changes with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - << 'EOF'
          import os
          import json
          import re
          import google.generativeai as genai

          api_key = os.environ.get("GEMINI_API_KEY")
          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")

          genai.configure(api_key=api_key)

          allowed_exts = ('.html', '.css', '.js', '.json', '.md', '.py', '.txt')
          files_context = {}

          for root, dirs, files in os.walk('.'):
              if '.git' in root or '.github' in root:
                  continue
              for file in files:
                  if file.endswith(allowed_exts):
                      filepath = os.path.relpath(os.path.join(root, file), '.')
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              files_context[filepath] = f.read()
                      except Exception:
                          pass

          prompt = f"""
          You are an automated software engineer.
          Request Title: {title}
          Details: {body}

          Existing files:
          {json.dumps(files_context, ensure_ascii=False)}

          Return ONLY a valid JSON object where keys are relative file paths and values are the complete updated file contents.
          Do not include conversational text or markdown blocks outside the JSON.
          """

          model = genai.GenerativeModel('models/gemini-3.6-flash')
          response = model.generate_content(prompt)

          text = response.text.strip()
          # پاکسازی مارک‌داون
          match = re.search(r'\{.*\}', text, re.DOTALL)
          if match:
              clean_json = match.group(0)
              try:
                  changes = json.loads(clean_json)
                  for path, content in changes.items():
                      os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
                      print(f"Updated successfully: {path}")
              except Exception as e:
                  print(f"JSON decode failed: {e}")
                  # در صورتی که ساختار تک فایلی بود مستقیماً روی index.html اعمال شود
                  if "index.html" in files_context:
                      with open("index.html", "w", encoding="utf-8") as f:
                          f.write(clean_json)
                      print("Fallback applied directly.")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "Gemini Bot"
          git config --global user.email "gemini-bot@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update via Issue: ${{ github.event.issue.title }}" && git push)
